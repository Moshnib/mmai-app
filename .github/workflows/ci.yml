# ============================================================
# Continuous checks. Runs on every push and every pull request.
#
# WHY THIS EXISTS
# Until 31 August 2026 this project had exactly ONE automated job -- the
# daily data refresh. Nothing checked the code. The verification scripts
# below existed and passed, but only when somebody remembered to run them.
#
# That gap had a cost the same day: Australia's inflation target changed
# to 2.5% and the Learn page kept publishing "|inflation - 2%|" for two
# hours, directly beneath a promise that a reader can reproduce any score
# by hand. It was found by accident during an audit.
#
# These jobs run in parallel because they are independent, and each fails
# loudly on its own rather than hiding behind an earlier failure.
# ============================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # One run per branch; a new push cancels the previous, still-running one.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Zero, as of 2026-08-31. The four warnings this workflow launched
      # with are fixed: buildSeries is now a useCallback with real
      # dependencies, and the font rule is disabled inline with the reason
      # it is a false positive under the App Router.
      #
      # Do NOT raise this to let a new warning through. If a warning is a
      # genuine false positive, disable that rule at the line with a comment
      # explaining why -- the way layout.tsx does.
      - run: npx eslint . --max-warnings 0

  scoring:
    name: Scoring correctness
    runs-on: ubuntu-latest
    # 20, not 10. This job grew: it installs Chromium, builds the site and
    # runs five browser checks over eleven pages on top of ~25 offline
    # ones. On 16 September it crossed ten minutes and GitHub cancelled it
    # mid-layout-check -- which reads as a red build caused by nothing.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # The five-pillar verifiers (verify-scoring, verify-history,
      # verify-published-formulas, measure-pillar-influence) were removed
      # at the cutover on 5 September 2026 along with the engine they
      # tested. verify-composite below covers the engine that replaced it,
      # and recomputes every published constant rather than pinning
      # outputs -- which is the stronger check of the two.

      # ---------- ENGINE v2.0, the three-dimension composite ----------
      # Recomputes every published constant from the 148-row reference set
      # with its own arithmetic -- indicator means and standard deviations,
      # the three dimension sds, the percentile ladder -- and fails if any
      # drifts from the documented value.
      #
      # The engine this replaces shipped a defect that made two of six
      # rankings wrong, and it survived because the constants were copied
      # by hand and never re-checked. It also pins the acceptance case,
      # Australia 2026 = 85.135135135, which a third party reproduced blind
      # from the published files alone: if this fails, the engine has moved
      # away from the thing that was externally verified.
      - name: Composite engine reproduces its published constants
        run: npx tsx scripts/verify-composite.ts

      # THE PAGE HAS TO REPRODUCE THE ENGINE, not merely agree with it.
      # The Learn page tells a reader they can take the raw numbers, run
      # them through the formulas shown, and get the exact published score.
      # That is the strongest claim the site makes, and from the cutover on
      # 5 September 2026 until this was added, NOTHING tested it: the old
      # verify-published-formulas went with the five-pillar engine and no
      # replacement was written. verify-composite above checks the engine
      # against its own constants, which would stay green while the page
      # printed something else entirely.
      #
      # This parses the numbers back OUT of the published strings and
      # rebuilds all six live scores from those alone. It caught the
      # Conditions weights being published rounded to one decimal, which
      # shifted the composite fifteen times further than the tightest rung
      # of the ladder -- right today, but by luck rather than arithmetic.
      - name: A reader can reproduce the score from the page alone
        run: npx tsx scripts/verify-published-formulas.ts

      # The Learn page publishes what the three dimensions ACTUALLY do --
      # effective influence and how far each spreads the six markets --
      # measured, not asserted. Equal thirds is the declared weight; the
      # effective spread is 14 points. This fails if those published
      # figures drift, AND if the dimensions ever converge on equal
      # influence, because the page's copy would then be wrong the other
      # way round.
      - name: Dimension influence still matches what the page claims
        run: npx tsx scripts/measure-dimension-influence.ts --check

      # The missing-data rule: a failed fetch must fall back to the most
      # recent COMPLETE observation and say so, never interpolate, and
      # never reach past the 14-day bound.
      - name: Observation fallback behaves
        run: npx tsx scripts/test-latest-complete.ts

      # The guard that stops the cutover emailing every subscriber about
      # every market at once.
      - name: Subscriber alert guard survives the engine change
        run: npx tsx scripts/test-alert-guard.ts

      # The change feed is event-driven, not calendar-driven: it compares
      # against the most recent DIFFERENT reading. These pin that it reaches
      # past still days, refuses a stale comparison, and ignores the one
      # indicator that is shown but no longer scored.
      - name: Change feed finds the real change
        run: npx tsx scripts/test-change-feed.ts

      # Bahrain inflation vanished from Gulf Watch on roughly four days in
      # ten -- not missing data, but an intermittent endpoint whose failure
      # wrote null straight over yesterday's perfectly good number. The six
      # scored markets already guard against this via latestComplete, which
      # cannot work for Gulf: a Gulf row is legitimately incomplete, so
      # "most recent COMPLETE row" would never match.
      #
      # These pin the two rules that make carrying a value forward honest
      # rather than a quiet fabrication -- the reporting date travels with
      # the value, and the carry expires -- plus that a live fetch is never
      # overwritten and a country with no source is never given one.
      # There were two market colour maps -- one in Compare, one in the
      # bond-yield panel -- disagreeing on five of six markets, with three
      # colours SWAPPED between countries. Red was the Euro Area on one
      # page and the United Kingdom on the other. Both palettes were
      # individually well chosen; the damage came from their disagreeing,
      # and nothing measured that -- the design audit counted hardcoded
      # hex colours without checking whether they agreed.
      #
      # One map now, so divergence is impossible. This holds what made
      # each palette good on its own: every market coloured, nothing
      # coloured that is not a market, and no two closer than dE 20.
      - name: One colour per market, all distinguishable
        run: npx tsx scripts/test-market-colours.ts

      # /stablecoins was in the navigation on every page, linked from the
      # 404 page, and covered by both browser checks -- and absent from the
      # sitemap for as long as it existed. Search engines were never told
      # about a page on a site whose whole purpose is to be found.
      #
      # It survived because there were THREE route lists and each was
      # individually plausible. There is one now, in lib/routes.ts, and
      # this compares it against what is actually on disk -- a list can
      # fall behind a new page, the filesystem cannot.
      - name: Every page is declared once, indexed, and checked
        run: npx tsx scripts/check-routes.ts

      # Retrying was added to the Gulf refresh because data.gov.bh answers
      # four days in ten -- and adding it without a budget quietly made a
      # worse failure likely. Six countries run one after another inside a
      # 60-second function with fetchers allowing 15 seconds each: one
      # attempt each is a worst case near 90 seconds, three attempts near
      # 277. That gets the function killed part-way, and a country never
      # written is worse off than one written with a gap, because
      # carry-forward never gets the chance to fill it.
      - name: Retrying does not spend time the caller does not have
        run: npx tsx scripts/test-retry-deadline.ts

      - name: A blinking Gulf source keeps its number, a dead one shows the gap
        run: npx tsx scripts/test-gulf-carry-forward.ts

      # The same lesson as the step above, one layer lower down. Node has no
      # default fetch timeout at all, so a source that accepts the connection
      # and then goes quiet is not a slow request -- it is one that never
      # returns. On 2026-09-10 Statistics Canada was answering intermittently
      # and our GDP call ran for 148,919ms before returning a 500; the sibling
      # call that had a timeout gave up at 8,016ms. Inside a 60-second function
      # that is the difference between one missing indicator and every market
      # after Canada going unwritten.
      #
      # Twenty-five call sites had no timeout, because the convention was
      # adopted partway through the project and never backfilled -- and a
      # fetcher without one looks identical to a fetcher with one on every
      # day the source happens to be healthy.
      - name: Every fetcher can give up on a source that stops answering
        run: npx tsx scripts/check-fetch-timeouts.ts

      # The three-year stablecoin line was reported as "like zigzag". The
      # data was fine; TrendChart orders its category axis by each point's
      # sortKey and falls back to the DISPLAY LABEL when none is given. The
      # page gave none, so 38 points labelled "Sep '23", "Oct '23" were
      # ordered as text -- Apr '25, Aug '24, Aug '26, Dec '24 -- hopping
      # between four years at every step. The same failure the bond panel
      # hit, which is why sortKey exists. A month-only label also collapsed
      # three pairs of points that fall in the same month.
      - name: The stablecoin history charts in date order, with every point
        run: npx tsx scripts/test-stablecoin-series.ts

      # The source audit first shipped with a grace period that compared
      # now against the REPORTING PERIOD rather than the release date. A
      # monthly figure is ~40 days old the morning it comes out and a
      # quarterly one ~100, so the grace was unreachable for 16 of the 20
      # probes and every ordinary release day would have gone red. It
      # looked right because the only series it was observed on was a
      # daily policy rate, where the two ages coincide -- one passing case
      # mistaken for a working design. Counting whole releases needs no
      # clock and gives the same answer at any hour.
      - name: A fresh release is never an alarm, a missed one always is
        run: npx tsx scripts/test-releases-behind.ts

      # stalenessOf says in its own doc comment that null means "no opinion,
      # never fine -- a caller must not read it as a pass". The refresh route
      # read it as a pass, via `if (verdict?.stale)`, which is false for null.
      # That is the failure mode of a DEAD source: a fetcher that throws
      # writes a NULL date, not a frozen old one, so the one thing guaranteed
      # to happen when a source dies was the one thing the age check could
      # not see, and staleMarkets stayed 0 throughout.
      - name: A figure with no observation date is reported, not passed
        run: npx tsx scripts/test-null-date-not-a-pass.ts

      # The unsubscribe link used to delete on a plain GET. Corporate mail
      # filters open every link in a message to vet it, so every subscriber
      # behind one would have been unsubscribed on arrival of their first
      # alert without clicking anything. This runs the route with the
      # database credentials REMOVED: a GET that tried to delete would throw,
      # so a GET that succeeds provably never reached the database.
      - name: Opening an unsubscribe link changes nothing
        run: npx tsx scripts/test-unsubscribe-safety.ts

      # The site reached twenty-seven distinct font sizes without anyone
      # deciding to have twenty-seven -- each was a reasonable local
      # choice, and 12, 12.5 and 13 ended up coexisting. A comment saying
      # "use the scale" would have stopped none of it, because the drift
      # came from copying a neighbouring component rather than from
      # reading the stylesheet. So the scale fails the build instead.
      - name: Every font size is on the scale
        run: npx tsx scripts/check-type-scale.ts

      # THE RETIRED LOOK STAYS RETIRED. The September 2026 restyle removed
      # neon cyan and violet, gradients, glass and glow from about forty
      # files, and the review of the plan found twenty-five places the
      # plan had missed. Drift on this site comes from copying an old
      # component, so each marker of the old look fails the build.
      - name: No glow, glass, gradients or retired colours
        run: npx tsx scripts/check-palette.ts

      # Every colour ever drawn as text, against both surfaces, with the
      # whole score ramp swept -- because the browser check only sees
      # today's scores and never measures SVG text. On navy, three colours
      # fell under 4.5:1 and CI would have passed or failed by the day.
      - name: Every text colour is legible on navy
        run: npx tsx scripts/check-palette-contrast.ts

      # Russia, Fiji and Antarctica cross the 180° line, and their outlines
      # drew full-width stripes across the homepage map -- over Canada and
      # Alaska -- for as long as the map existed. Nothing overflowed and
      # nothing threw, so no other check could see it.
      - name: The world map draws no stripes
        run: npx tsx scripts/test-map-seam.ts

      # The strip along the top now carries the site's own figures moving.
      # Two ways that goes wrong and neither throws: a rounding artefact
      # printed as a change, and a three-week-old move scrolling as if it
      # were this morning -- which is what makes a site look abandoned.
      - name: The ticker only reports real, recent changes
        run: npx tsx scripts/test-ticker-events.ts

      # Two outside feeds reach the homepage now -- the ONS release
      # calendar and the ECB press feed -- and neither is scored, which is
      # exactly why they need pinning: nothing downstream would notice a
      # speech printed as a rate decision, or a release that already
      # happened shown as "next".
      - name: The announcements band says only what those feeds said
        run: npx tsx scripts/test-news-feeds.ts

      # THE ONE THAT WOULD HAVE CAUGHT "SWEDEN CONTRIBUTES 0".
      #
      # The Learn page ranked every scored market by how many rows it
      # contributes to the frozen 148-row reference set and named the
      # smallest. Sweden joined after that set was frozen, so Sweden
      # contributes zero, so Sweden became "the smallest" -- and the page
      # published "Sweden is under-represented in the record ... Sweden
      # contributes 0, because for eight of those years its central bank
      # targeted the quantity of money". Zero and eight in one sentence,
      # and the eight-year reason belongs to Japan. Live for days.
      #
      # Four pages also said "seven markets" within a minute of Norway
      # becoming the eighth.
      #
      # Neither throws, neither moves a pixel, neither fails a type check.
      # A sentence that has merely gone STALE is invisible to every other
      # check in this file, which is why this one counts.
      - name: Market counts in copy are derived, not typed
        run: npx tsx scripts/test-market-count-copy.ts

      # THE ONE THAT WOULD HAVE CAUGHT KOREA WRITING NO ROW AT ALL.
      #
      # MMAI withholds a score when an indicator is missing, and the
      # refresh route wrote band=null to match -- above a comment claiming
      # that was "what the mmai_scores check constraint enforces". The
      # schema says the opposite: band is NOT NULL. So a market that
      # withheld could not be written at all, and on the site a market
      # with no row is indistinguishable from one never configured.
      #
      # Dormant for months, because every market always returned all five
      # indicators. Korea arrived with three nulls on 13 September and the
      # run reported a Postgres constraint violation instead of a withheld
      # score. It type-checked, and passed every other test in this file.
      - name: A withheld score is still a storable row
        run: npx tsx scripts/test-withheld-score-is-storable.ts

      # THE ONE THAT WOULD HAVE CAUGHT THREE SEPARATE OMISSIONS.
      #
      # Adding a market touches ten files and the compiler enforces none
      # of it -- every one is a Record keyed by string, so a missing entry
      # is an empty chart rather than a type error.
      #
      #   Sweden shipped with no flag, map shape or glyph, and the site
      #   owner reported it.
      #   Norway shipped with annual history only; its monthly view was
      #   empty for a day and its charts still rendered, so nothing looked
      #   wrong.
      #   Korea shipped with no history at all -- four empty panels on a
      #   page called Data Over Time.
      #
      # None failed a build, threw, or moved a pixel anywhere a check was
      # looking.
      - name: Every market is wired into every market-keyed file
        run: npx tsx scripts/test-market-completeness.ts

      # THE ONE THAT WOULD HAVE CAUGHT THE CONTACT FORM.
      #
      # Loads every page in a real browser at phone, tablet and desktop
      # width and fails if anything escapes the box holding it. The contact
      # form's email field ended 118px past the edge of its card on a
      # phone, and was reported as verified, because the manual sweep
      # behind that claim covered seven pages out of eight and asked "does
      # the page scroll sideways" rather than "does anything overflow".
      #
      # Layout is the one thing on this site that cannot be checked by
      # reading the source: it only exists once a browser has laid it out
      # at a particular width. So this is the one check that needs a real
      # browser, and it is worth the ninety seconds it costs.
      - name: Every page holds its layout
        run: |
          npx playwright install --with-deps chromium
          npm run build
          npx next start -p 3123 &
          # Plain retry rather than another dependency just to wait for a port.
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3123/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3123/ || { echo "server never came up"; exit 1; }
          npx tsx scripts/check-layout.ts
          # Same server, second question. check-layout asks whether the
          # pages LOOK right; this asks whether they RUN right -- a
          # component that throws after hydration, a request that 404s, a
          # resource the CSP blocks. None of those move a pixel, so the
          # layout check walks straight past them, and the build does too.
          #
          # The CSP is the reason it earns its place: hand-written,
          # enforced only in the browser, and silent when wrong.
          npx tsx scripts/check-runtime-errors.ts
          # Third question, same server. An SVG scales its TEXT along with
          # everything else, so a chart drawn on a 900-wide canvas and
          # rendered into a 292px card puts its 10px axis labels on screen
          # at 3.2px. That is what /compare and /gulf-watch were doing on a
          # phone, measured.
          #
          # Nothing else could see it: the chart fitted its container, so
          # the layout check found no overflow; nothing threw; and the
          # source says fontSize={10}, which looks fine. check-type-scale
          # polices the size a component DECLARES -- this polices the size a
          # reader actually gets.
          npx tsx scripts/check-text-legibility.ts
          # Fourth question, same server: can a reader NAME and OPERATE the
          # page? A sweep found two unnamed year pickers on /compare -- two
          # identical combo boxes with a bare "to" between them -- and a
          # card at h3 directly under the only h1, so the outline skipped a
          # level. Neither breaks a build, overflows a box, or throws.
          #
          # Contrast is measured here rather than asserted. The design audit
          # said it was clean and was right; nothing re-checked it, and a
          # colour token changes in one commit while a claim goes stale in
          # the next.
          npx tsx scripts/check-accessibility.ts
          # Fifth question, same server: what does a SEARCH ENGINE get,
          # and what does a person see when the link is pasted into a
          # chat? Neither is visible on the site itself.
          #
          # Three things were live on 14 September: no page emitted a
          # canonical URL at all, every page shared ONE social card
          # because ten pages set a title and description and none set
          # openGraph, and there was no structured data anywhere. The
          # canonical one matters most right now -- this site is about to
          # move to a real domain, and without canonicals a crawler
          # reaching both hosts may treat the new domain as a duplicate
          # of the old.
          npx tsx scripts/check-seo.ts

      # THE ONE THAT WOULD HAVE CAUGHT 4 FEBRUARY.
      # Eurostat retired the euro area HICP dataset that day. It kept
      # answering and kept returning December 2025, so every check the
      # project had -- all of which measured when we last ASKED -- stayed
      # green for nine months while the Euro Area was published a full
      # band too high.
      #
      # No network and no keys: this tests the RULES, and asserts that no
      # scored source can quietly fall outside them.
      - name: Freshness rules hold, and nothing is silently unchecked
        run: npx tsx scripts/verify-freshness.ts

      # The source registry became load-bearing on 2026-09-02: it now
      # GENERATES the provenance line stored on every scored row. Before
      # that the line was hand-maintained and drifted three ways at once
      # — four markets credited the World Bank for data from Statistics
      # Canada, the ONS, the ABS and e-Stat; every market credited the
      # EIA, which scores nothing; and none credited the BIS, which does.
      - name: Source registry is complete, and no pillar is unattributed
        run: npx tsx scripts/verify-sources.ts

      # Both found by audit on 2026-09-02. The refresh endpoints FAILED
      # OPEN — a missing CRON_SECRET admitted everyone rather than nobody,
      # so one deleted environment variable would have let strangers burn
      # the BEA/BLS/e-Stat quotas, write through the service role, and
      # fire subscriber emails. The public write endpoints had no volume
      # limit at all.
      - name: Refresh fails closed, and public writes are bounded
        run: npx tsx scripts/verify-security.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Placeholders, not secrets. next build only needs these to exist so
      # module-level client construction does not throw during prerender;
      # no request is made at build time. Real values live in Vercel.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
