# ============================================================
# Scheduled data refresh — the PRIMARY trigger for MMAI's data.
#
# WHY THIS EXISTS
# vercel.json also declares crons, but this project is on Vercel's Hobby
# tier where cron jobs are explicitly best-effort: Vercel may delay them
# by hours or skip a day entirely. Observed directly -- 2026-08-28 ran 25
# minutes late, 2026-08-29 had not run at all two hours past schedule,
# while both routes answered correctly when called by hand. The site then
# showed "Data last updated Aug 28" to every visitor.
#
# GitHub Actions schedules are far more dependable, are free on this
# plan (a curl takes seconds against a 2,000 minute monthly allowance),
# and are re-runnable by hand from the Actions tab when something does
# go wrong.
#
# THREE RUNS A DAY, NOT ONE. The later two are safety nets: if the 06:10
# run fails or GitHub delays it, the next attempt fills the gap on its
# own. This is only safe because the routes skip markets that already
# have a reading for today -- see the freshness guard in
# app/api/refresh/route.ts. Extra runs are cheap no-ops, never duplicates.
#
# The Vercel crons are deliberately LEFT IN PLACE as a third layer. If
# they fire, they simply find the work already done.
# ============================================================
name: Refresh MMAI data

on:
  schedule:
    # UTC. 06:10 is the intended daily refresh; the rest are recovery.
    - cron: "10 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  # Adds a "Run workflow" button in the Actions tab, so a missed day can
  # be fixed in one click without waiting or touching a terminal.
  workflow_dispatch:
    inputs:
      force:
        description: "Re-fetch markets that already have a reading today (use after fixing or changing a source)"
        type: boolean
        default: false

concurrency:
  # Never let two refreshes overlap.
  group: mmai-refresh
  cancel-in-progress: false

env:
  # WHERE TO CALL. The address used to be typed into each curl below, which
  # meant a domain move would keep this job pointing at the old host -- and
  # it would keep succeeding there, so the only symptom would be a live site
  # whose data quietly stopped updating.
  #
  # Set the repository variable SITE_URL (Settings > Secrets and variables >
  # Actions > Variables) when the domain moves. Until then this falls back to
  # the vercel.app address, exactly as lib/siteUrl.ts does for the app.
  SITE_URL: ${{ vars.SITE_URL || 'https://mmai-app.vercel.app' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ---------------------------------------------------------------
      # Japan's unemployment, fetched HERE rather than by the Vercel
      # function that does every other indicator.
      #
      # OECD is reachable from this runner and NOT from Vercel. That was
      # verified the hard way: the request completes in ~2s from a laptop
      # and from here, and still fails in production, so it is OECD
      # refusing Vercel's egress rather than slowness. Japan therefore
      # fell back to a World Bank ANNUAL figure dated January 2025 -- the
      # last stale input in the index.
      #
      # This step relays the value to the refresh route as a parameter.
      # It deliberately does NOT write to Supabase directly: that would
      # need the service-role key as a GitHub secret, widening the blast
      # radius of this workflow for one indicator.
      #
      # continue-on-error: a failure here must not stop the refresh. The
      # route falls back exactly as it does today.
      - name: Fetch Japan unemployment from OECD
        id: jp
        continue-on-error: true
        run: |
          URL='https://sdmx.oecd.org/public/rest/data/OECD.SDD.TPS,DSD_LFS@DF_IALFS_UNE_M,1.0/JPN.UNE_LF_M.PT_LF_SUB._Z.Y._T.Y_GE15._Z.M?lastNObservations=1&format=csvfile'
          # format=csvfile, never csvfilewithlabels -- the label expansion
          # takes 11-40s against ~0.1s. See lib/fetchers/oecd.ts.
          curl -sS --max-time 60 "$URL" -o /tmp/jp.csv || exit 0
          head -2 /tmp/jp.csv
          # Columns BY HEADER NAME. This dataflow carries 16 columns and
          # OECD reorders them; positional indexing would silently read the
          # wrong field.
          VAL=$(awk -F, 'NR==1{for(i=1;i<=NF;i++){if($i=="OBS_VALUE")v=i;if($i=="TIME_PERIOD")t=i}} NR==2{print $v}' /tmp/jp.csv)
          PER=$(awk -F, 'NR==1{for(i=1;i<=NF;i++){if($i=="TIME_PERIOD")t=i}} NR==2{print $t}' /tmp/jp.csv)
          echo "parsed value=$VAL period=$PER"
          if [ -n "$VAL" ] && [ -n "$PER" ]; then
            echo "jpUnemployment=$VAL" >> "$GITHUB_OUTPUT"
            echo "jpUnemploymentDate=$PER-01" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh scored markets
        run: |
          echo "Calling /api/refresh (force=${{ inputs.force }}) …"
          # The freshness guard skips any market already stamped today, which
          # is what makes three runs a day safe. That same guard blocks a
          # deliberate re-run after a SOURCE CHANGE -- the readings exist, they
          # were just produced by the old source. force=1 overrides it, and is
          # only ever set by hand from the Actions tab, never on a schedule.
          URL="${SITE_URL}/api/refresh"
          if [ "${{ inputs.force }}" = "true" ]; then
            URL="$URL?force=1"
            echo "FORCE: re-fetching markets that already have a reading today"
          fi
          # Relay Japan unemployment if the step above got it. Absent, the
          # route behaves exactly as before and falls back.
          JP="${{ steps.jp.outputs.jpUnemployment }}"
          JPD="${{ steps.jp.outputs.jpUnemploymentDate }}"
          if [ -n "$JP" ] && [ -n "$JPD" ]; then
            SEP=$([ "${URL#*\?}" != "$URL" ] && echo "&" || echo "?")
            URL="${URL}${SEP}jp_unemployment=${JP}&jp_unemployment_date=${JPD}"
            echo "relaying Japan unemployment ${JP} (${JPD})"
          fi
          code=$(curl -sS -o /tmp/main.json -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "$URL")
          echo "HTTP $code"
          head -c 800 /tmp/main.json; echo
          # Fail the run on a non-200 so the failure is visible in the
          # Actions tab and by email, rather than silently doing nothing.
          [ "$code" = "200" ] || exit 1

          # ---------- A SOURCE CAN DIE WITHOUT FAILING ----------
          # Eurostat retired the euro area HICP dataset on 2026-02-04. It
          # kept answering instantly, kept returning December 2025, and
          # every run above stayed green for nine months while MMAI
          # published a stale inflation figure and the wrong band for the
          # Euro Area.
          #
          # The route now compares each figure's own observation date
          # against how often its source actually publishes, and reports
          # the count here. Failing the run is the whole point: a warning
          # in a log nobody reads is what let this happen. A red run sends
          # an email.
          #
          # THE DATA IS ALREADY WRITTEN by the time this fires. Failing
          # does not roll anything back and is not meant to -- it exists
          # to make a human look.
          stale=$(node -e 'try{const j=require("/tmp/main.json");process.stdout.write(String(j.staleMarkets??0))}catch(e){process.stdout.write("0")}')
          if [ "$stale" != "0" ]; then
            echo
            echo "::error::$stale market(s) reported a figure older than its source's publication rhythm allows."
            echo "A source has probably been retired or moved. Check the 'stale' field per market above,"
            echo "then confirm against the institution directly before changing any limit in lib/freshness.ts."
            exit 1
          fi
          echo "Freshness: no indicator is older than its source's cadence allows."

          # ---------- ARE THE PUBLISHED STATISTICS STILL TRUE? ----------
          # The Learn page prints how far each pillar spreads the six
          # markets, as a measured fact. Those numbers are measured
          # offline from a snapshot a human keeps in sync BY HAND, and on
          # 2026-09-02 that snapshot was found nine months stale: the page
          # told readers growth separated the markets least when monetary
          # conditions did.
          #
          # CI cannot catch this. scripts/measure-pillar-influence.ts runs
          # there and passed the whole time, because it checks the
          # constants against the panel -- it cannot tell the panel itself
          # is stale. Only a run with live data can, which is this one.
          drift=$(node -e 'try{const j=require("/tmp/main.json");const d=j.publishedDrift||[];process.stdout.write(d.join(" | "))}catch(e){process.stdout.write("")}')
          if [ -n "$drift" ]; then
            echo
            echo "::error::The Learn page is publishing statistics that no longer match live data: $drift"
            echo "Re-sync FALLBACK_MARKETS in lib/markets.ts to the database, then run"
            echo "  npx tsx scripts/measure-pillar-influence.ts"
            echo "and update PILLAR_CROSS_MARKET_SD / PILLAR_EFFECTIVE_INFLUENCE in lib/scoring.ts."
            exit 1
          fi
          echo "Published statistics still match live data."

          # ---------- SUBSCRIBER ALERTS ----------
          # Set only when EVERY notification for a market failed, which
          # points at the sender rather than the addresses. Real people
          # signed up for these; a silent failure is a broken promise
          # nobody finds out about, because band crossings are rare enough
          # that months could pass before anyone complains.
          broken=$(node -e 'try{const j=require("/tmp/main.json");process.stdout.write(String(j.notificationsBroken===true))}catch(e){process.stdout.write("false")}')
          if [ "$broken" = "true" ]; then
            echo
            echo "::error::Every subscriber notification failed. This is the sender, not the addresses."
            echo "A vercel.app address CANNOT be verified as a Resend sending domain"
            echo "as a Resend sending domain — verification needs DNS records on a domain you own."
            exit 1
          fi

      # The force input reaches this endpoint too. It did not: the
      # scored-markets step above built ?force=1 from inputs.force and
      # this one sent a bare URL, so the documented remedy for a bad row
      # -- ?force=1, which overrides the "already written today" guard --
      # was unreachable from the Actions tab. Recovering from a wrongly
      # stored Gulf value meant hand-rolling a curl with CRON_SECRET.
      - name: Refresh Gulf Watch
        run: |
          echo "Calling /api/refresh-gulf …"
          code=$(curl -sS -o /tmp/gulf.json -w "%{http_code}" --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${SITE_URL}/api/refresh-gulf?force=${{ inputs.force && 1 || 0 }}")
          echo "HTTP $code"
          head -c 800 /tmp/gulf.json; echo
          [ "$code" = "200" ] || exit 1

      # ---------------------------------------------------------------
      # DOES WHAT WE PUBLISH STILL AGREE WITH ITS SOURCE?
      #
      # Every other freshness check reasons about AGE, and can only be
      # as good as the allowances written beside it -- the UK labour
      # series legitimately carries 170 days, the BIS debt series 420.
      # A source can fail inside its own allowance and nothing notices,
      # because a failed fetch is served from the previous reading and
      # every page looks perfectly healthy.
      #
      # This asks all twenty sources directly, straight after the
      # refresh, and fails the run if the site is publishing a figure
      # its own source no longer agrees with -- a missed release, an
      # unapplied revision, or a fetcher that has quietly broken.
      #
      # It does NOT catch a source that keeps answering and stops
      # updating; Eurostat returned December 2025 for nine months and a
      # stored-versus-live comparison would have matched every day. That
      # half belongs to the age rules in lib/freshness.ts. Neither check
      # replaces the other.
      #
      # WHY A CURL AND NOT `npx tsx scripts/check-sources-live.ts`. The
      # script was the first attempt and it cannot run here. Its
      # fetchers need BEA, BLS and e-Stat keys plus the Supabase
      # credentials, and this repository holds exactly one secret --
      # CRON_SECRET. The other five are Vercel environment variables. A
      # step naming secrets that do not exist does not skip: it runs
      # with empty strings and fails every single morning for a reason
      # that has nothing to do with the data, which is precisely the
      # alarm people learn to ignore -- and then the real one goes
      # unread too. So the check runs where the keys already are, called
      # from here exactly like the two refreshes above. The script stays
      # for local runs.
      #
      # It runs LAST on purpose: a disagreement after both refreshes
      # means the refresh could not put it right, rather than that it
      # had not run yet.
      # ---------------------------------------------------------------
      - name: Published figures still agree with their sources
        # RUNS EVEN IF A STEP ABOVE FAILED, which is the whole point. A step
        # with no `if:` inherits success(), so this would have been SKIPPED on
        # exactly the mornings it is most wanted: the day an age rule fires,
        # the refresh step exits 1 and this -- the check that says WHICH source
        # and HOW it disagrees -- would never have run. A Gulf-side outage
        # (data.gov.bh answers four days in ten) would likewise have cancelled
        # a scored-market audit that has nothing to do with it.
        if: always()
        run: |
          echo "Calling /api/source-audit …"
          code=$(curl -sS -o /tmp/audit.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${SITE_URL}/api/source-audit")
          echo "HTTP $code"
          # Print every row, matching or not. A green run that shows
          # nothing is indistinguishable from a check that does nothing.
          node -e 'try{const j=require("/tmp/audit.json");for(const r of j.rows||[])console.log("  "+String(r.verdict).padEnd(20)+String(r.name).padEnd(24)+"site "+r.storedValue+" "+r.storedDate+"   source "+r.liveValue+" "+r.liveDate)}catch(e){console.log("(could not parse the response)")}'
          [ "$code" = "200" ] || { head -c 500 /tmp/audit.json; echo; exit 1; }

          # A SOURCE HAVING A BAD DAY IS NOT THE SITE BEING WRONG, and the
          # two are counted separately for that reason. Statistics Canada
          # was measured on 2026-09-10 answering three identical requests
          # with 200 in 10.7s, nothing in 45s, and 502 in 35s -- while the
          # Canadian figures on the site were entirely correct. Failing the
          # run on that would produce exactly the daily false alarm people
          # learn to skip, and then the real one goes unread too.
          #
          # A fetcher that stays broken is NOT let off, though the reason is
          # not the one this comment used to give. It claimed the stored date
          # stops advancing and the age check above catches it. It does not:
          # a dead fetcher writes a NULL date, stalenessOf has no opinion on a
          # null, and that was read as a pass -- so nothing fired at all. The
          # refresh route now reports a figure that arrives without a date,
          # and a figure that does not arrive leaves its pillar null, which
          # withholds the composite and shows N/A on the page after 14 days.
          down=$(node -e 'try{const j=require("/tmp/audit.json");process.stdout.write(String(j.sourcesDown??0))}catch(e){process.stdout.write("0")}')
          if [ "$down" != "0" ]; then
            echo
            node -e 'try{const j=require("/tmp/audit.json");for(const u of j.unreachable||[])console.log("  "+u)}catch(e){}'
            echo "::warning::$down source(s) did not answer today. That is the source, not"
            echo "the stored figure -- it could not be confirmed, not shown to be wrong."
          fi

          bad=$(node -e 'try{const j=require("/tmp/audit.json");process.stdout.write(String(j.disagreements??0))}catch(e){process.stdout.write("0")}')
          if [ "$bad" != "0" ]; then
            echo
            node -e 'try{const j=require("/tmp/audit.json");for(const p of j.problems||[])console.log("  "+p)}catch(e){}'
            echo "::error::$bad published figure(s) disagree with their own source."
            echo "A failed fetch is served from the previous reading, so every page looks"
            echo "healthy either way -- this is the only check that opens the box."
            exit 1
          fi
          echo "Every figure that could be reached agrees with its live source."
